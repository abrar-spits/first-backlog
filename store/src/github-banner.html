<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GitHub banner</title>
<link rel="stylesheet" href="store.css">
<style>
  body { width: 1280px; height: 560px; position: relative; }
  .text { position: absolute; left: 72px; top: 50%; transform: translateY(-50%); width: 430px; display: grid; gap: 20px; }
  h1 { font-size: 54px; }
  .frame { position: absolute; left: 560px; top: 64px; border-bottom: 0; border-radius: 14px 14px 0 0; }
  .frame iframe { margin-top: -96px; } /* skip the breadcrumb and filter bar */
</style>
</head>
<body>
  <div class="text">
    <span class="eyebrow"><img src="icon-art.png" alt="">First Backlog</span>
    <h1>Your <em>Backlog</em> comes first.</h1>
    <p class="lede">A Chrome extension for GitLab issue boards: Backlog before Open, every list in its own color, and cards you can read at a glance.</p>
  </div>
  <div class="frame"><iframe src="board.html?col=300" width="1000" height="592" title="Board"></iframe></div>
</body>
</html>
