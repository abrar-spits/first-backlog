<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Small promo tile</title>
<link rel="stylesheet" href="store.css">
<style>
  body { width: 440px; height: 280px; padding: 38px 36px; display: grid; align-content: space-between; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand img { width: 64px; height: 64px; border-radius: 22%; box-shadow: 0 0 0 1px rgb(255 255 255 / 0.16); }
  .brand b { font-size: 28px; font-weight: 750; letter-spacing: -0.02em; }
  p { margin: 0; font-size: 21px; font-weight: 600; line-height: 1.3; letter-spacing: -0.01em; }
  p em { font-style: normal; color: var(--orange); }
  small { display: block; margin-top: 6px; color: var(--muted); font-size: 14px; font-weight: 500; }
</style>
</head>
<body>
  <div class="brand"><img src="icon-art.png" alt=""><b>First Backlog</b></div>
  <p>Your <em>Backlog</em> first, every card clearer.<small>For GitLab issue boards</small></p>
</body>
</html>
